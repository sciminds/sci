version: "2"

linters:
  default: standard
  enable:
    - dupl
    - dupword
    - errorlint

  settings:
    dupl:
      threshold: 120
    # Guard sentinel matching: `err == sql.ErrNoRows` breaks the moment a
    # layer wraps the error with %w. Comparison-only for now — the errorf
    # and asserts checks would flag a wider class than we've cleaned up.
    errorlint:
      comparison: true
      errorf: false
      asserts: false

  exclusions:
    rules:
      # CLI command definitions are inherently repetitive (flags, ArgsUsage,
      # Action boilerplate). Abstracting them makes urfave/cli wiring harder
      # to read.
      - path: "^cmd/"
        linters: [dupl]
      - path: "cli/"
        linters: [dupl]

      # Test duplication is often intentional — each test is self-contained.
      - path: "_test\\.go$"
        linters: [dupl, dupword]
